site_name: Simulador de Previdência Privada
site_description: Documentação técnica da arquitetura, modelagem estocástica e regras fiscais.
theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

nav:
  - Início & Arquitetura: index.md
  - Modelagem Matemática: matematica.md
  - Regras Tributárias: tributacao.md
  - Banco de Dados & API: banco_e_api.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js